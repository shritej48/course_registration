{% extends 'base.html' %}
{% block title %}Edit Course{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Edit Course</h2>
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="course_name">Course Name</label>
            <input type="text" id="course_name" name="course_name"
                   value="{{ course.course_name }}" required>
        </div>

        <div class="form-group">
            <label for="student_name">Student Name</label>
            <select id="student_name" name="student_name" required>
                <option value="">-- Select Student --</option>
                {% for s in students %}
                    <option value="{{ s.student_name }}"
                        {% if s.student_name == course.student_name %}selected{% endif %}>
                        {{ s.student_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="duration">Duration</label>
            <input type="text" id="duration" name="duration"
                   value="{{ course.duration }}" required>
        </div>

        <div class="form-group">
            <label for="fees">Fees ($)</label>
            <input type="number" id="fees" name="fees"
                   value="{{ course.fees }}" required>
        </div>

        <button type="submit" class="btn-submit">Update Course</button>
    </form>
</div>
{% endblock %}
