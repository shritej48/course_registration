{% extends 'base.html' %}
{% block title %}Add Enrollment{% endblock %}
{% block content %}
<div class="form-container">
    <h2>New Enrollment</h2>
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="student_name">Student Name</label>
            <select id="student_name" name="student_name" required>
                <option value="">-- Select Student --</option>
                {% for s in students %}
                    <option value="{{ s.student_name }}">{{ s.student_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="course_name">Course Name</label>
            <select id="course_name" name="course_name" required>
                <option value="">-- Select Course --</option>
                {% for c in courses %}
                    <option value="{{ c.course_name }}">{{ c.course_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Enrollment Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <button type="submit" class="btn-submit">Enroll</button>
    </form>
</div>
{% endblock %}
