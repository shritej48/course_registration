{% extends 'base.html' %}
{% block title %}Edit Student{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Edit Student</h2>
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="student_name">Student Name</label>
            <input type="text" id="student_name" name="student_name"
                   value="{{ student.student_name }}" required>
        </div>

        <div class="form-group">
            <label for="course_name">Course Name</label>
            <select id="course_name" name="course_name" required>
                <option value="">-- Select Course --</option>
                {% for c in courses %}
                    <option value="{{ c.course_name }}"
                        {% if c.course_name == student.course_name %}selected{% endif %}>
                        {{ c.course_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ student.email }}" required>
        </div>

        <div class="form-group">
            <label for="ph">Phone</label>
            <input type="text" id="ph" name="ph"
                   value="{{ student.ph }}" required>
        </div>

        <button type="submit" class="btn-submit">Update Student</button>
    </form>
</div>
{% endblock %}
