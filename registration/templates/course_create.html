{% extends 'base.html' %}
{% block title %}Add Course{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Add New Course</h2>
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="course_name">Course Name</label>
            <input type="text" id="course_name" name="course_name"
                   placeholder="Enter course name" required>
        </div>

        <div class="form-group">
            <label for="student_name">Student Name</label>
            <select id="student_name" name="student_name" required>
                <option value="">-- Select Student --</option>
                {% for s in students %}
                    <option value="{{ s.student_name }}">{{ s.student_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="duration">Duration</label>
            <input type="text" id="duration" name="duration"
                   placeholder="e.g. 6 Months" required>
        </div>

        <div class="form-group">
            <label for="fees">Fees ($)</label>
            <input type="number" id="fees" name="fees"
                   placeholder="Enter fees amount" required>
        </div>

        <button type="submit" class="btn-submit">Add Course</button>
    </form>
</div>
{% endblock %}
